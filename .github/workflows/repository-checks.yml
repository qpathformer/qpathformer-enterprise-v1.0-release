name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readme-links:
    name: README links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Markdown parser
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci/requirements.txt
      - name: Test link-checker failure cases
        run: python -m unittest discover -s .github/ci/tests -p 'test_check_readme_links.py' -v
      - name: Check tracked README links
        run: python .github/ci/check_readme_links.py

  json-syntax:
    name: JSON syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test JSON-checker failure cases
        run: python -m unittest discover -s .github/ci/tests -p 'test_check_json.py' -v
      - name: Check tracked JSON and JSONL files
        run: python .github/ci/check_json.py
